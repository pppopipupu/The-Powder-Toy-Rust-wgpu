[workspace]
resolver = "2"
members = [
    "crates/tpt-core",
    "crates/tpt-sim",
    "crates/tpt-save",
    "crates/tpt-lua",
    "crates/tpt-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-only"

[workspace.dependencies]
wgpu = "30.0.1"
cubecl = { version = "0.11.3", default-features = false, features = ["std", "stdlib", "wgpu"] }
# `cubecl-runtime`'s default feature set enables `persistence`, which pulls the
# libSQL fork (`turso`) and builds it as a library, a cdylib and a staticlib —
# minutes of C and Rust compilation the simulator never uses. Every crate in the
# chain has to opt out, because one crate's defaults re-enable it for all.
cubecl-wgpu = { version = "0.11.3", default-features = false, features = ["std"] }
cubecl-core = { version = "0.11.3", default-features = false, features = ["std"] }
cubecl-runtime = { version = "0.11.3", default-features = false, features = ["std", "channel-mutex", "channel-mpsc", "channel-cell"] }
winit = "0.30.13"
egui = { version = "0.37.0", features = ["default_fonts", "bytemuck", "serde"] }
egui-wgpu = { version = "0.37.0", features = ["winit"] }
egui-winit = "0.37.0"
mlua = { version = "0.12.2", features = ["lua54", "vendored", "serde"] }
png = "0.18.1"
bytemuck = { version = "1.25.2", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3.3"
flate2 = "1.1.10"
glam = { version = "0.34.1", features = ["bytemuck", "serde"] }
pollster = "1.0.1"

tpt-core = { path = "crates/tpt-core" }
tpt-sim = { path = "crates/tpt-sim" }
tpt-save = { path = "crates/tpt-save" }
tpt-lua = { path = "crates/tpt-lua" }

# Keep `target/` small: the GPU stack (wgpu/cubecl/turso) is where the DWARF
# bulk lives, and this project debugs through GPU error messages and the
# headless smoke run rather than a Rust stepper. Workspace crates keep line
# tables so a panic backtrace still points at a file and line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.test]
debug = "line-tables-only"

[profile.test.package."*"]
debug = false

[profile.release]
opt-level = 3
# Thin LTO re-optimises the whole dependency graph once per final binary, and a
# `cargo test --release` run links several of them; that pass, not the codegen,
# is what made a test cycle take minutes. The simulation is GPU-bound, so the
# inlining it bought is not worth it.
lto = false
# `codegen-units = 1` turns every crate into one single-threaded codegen pass,
# which on the `cubecl`-heavy simulation crate costs minutes of wall time for a
# few percent of throughput; 16 parallel units build several times faster.
codegen-units = 16
strip = true
