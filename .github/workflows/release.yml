name: release

# Every tag push builds the three shipped binaries and publishes them as a
# GitHub release. wgpu/CubeCL resolve the device at runtime, so the runners only
# compile without executing any tests.
on:
  push:
    tags: ['*']
  # Lets a workflow change be compiled on the default branch before a tag is
  # cut, without publishing anything (the `release` job only runs on tags).
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  # A re-pushed tag must supersede its own in-progress run: `false` left the
  # newer commit waiting behind a stalled build for the same ref.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # A cold CubeCL build is 8-15 min per target. Anything beyond this is a
    # stalled transfer or a wedged runner, not compilation, so fail and let the
    # tag be re-run instead of holding the job for the 360 min default.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # MSVC, not the workstation's windows-gnu: the repository pins no
          # toolchain and no linker paths, and MSVC's `link.exe` honours the
          # COFF `/INCLUDE:` directives that keep the `linkme` kernel registry
          # alive. The `-Wl,--no-gc-sections` workaround in `.cargo/config.toml`
          # is scoped to `x86_64-pc-windows-gnu` and is not needed here.
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: .exe
            # A published .exe must not depend on the Visual C++ redistributable.
            rustflags: -C target-feature=+crt-static
          - name: linux-x86_64
            # Pinned rather than `ubuntu-latest`: that label just migrated to
            # the Ubuntu 26 ("resolute") image, and linking there raises the
            # artifact's glibc floor above 24.04's 2.39, so the binary would
            # refuse to start on older distributions. Pinning also keeps the apt
            # mirror set from changing under a release build.
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            ext: ''
            rustflags: ''
          - name: macos-aarch64
            # `macos-latest` is a rolling label that migrates gradually over
            # 1-2 months (actions/runner-images README): two runs of the same
            # tag can land on different macOS images and SDKs. Pin the arm64
            # image it currently resolves to, `macos-26`, which is also the
            # image 0.2.0 built on. The hosted arm64 pool is capacity-limited:
            # a queued job can be cancelled with "The job was not acquired by
            # Runner of type hosted" before any step runs (0.2.1). release-
            # retry.yml detects that cancellation and reruns the whole run.
            os: macos-26
            target: aarch64-apple-darwin
            ext: ''
            rustflags: ''
    steps:
      - uses: actions/checkout@v7

      # Cold builds take 8-15 min per target; restoring `target/` and the
      # registry keeps later tags to the changed crates only.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # No apt step: winit resolves wayland through `wayland-backend/dlopen`
      # (winit's default `wayland-dlopen`) and xkbcommon through `xkbcommon-dl`,
      # both of which load the system .so at runtime, so nothing is linked
      # against libwayland or libxkbcommon at build time. Installing the -dev
      # headers anyway made every Linux release depend on the Ubuntu mirrors,
      # which is what stalled two runs there for 36 min and failed a third.

      - name: Update toolchain and add target
        run: |
          rustup update stable --no-self-update
          rustup target add --toolchain stable ${{ matrix.target }}
          # `stable` is a rolling channel: two tags can compile with different
          # compilers. Record the exact versions so a regression is attributable.
          rustc +stable -Vv
          cargo +stable -V

      - name: Build
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --locked -p tpt-app --target ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: tpt-app-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/tpt-app${{ matrix.ext }}
          if-no-files-found: error
          # A self-healed rerun re-uploads the same artifact name; without
          # overwrite the second attempt dies on the name collision.
          overwrite: true
          # Keep successful artifacts even when publish is skipped, so a
          # wedged macOS job does not discard the other two binaries.
          retention-days: 7

  release:
    name: publish release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          mkdir -p dist

          # Every platform must upload a non-empty binary. Validate up front so
          # a missing/empty artifact names the platform instead of failing later
          # with a bare `chmod: cannot access ...`.
          bins=(
            "tpt-app-x86_64-pc-windows-msvc/tpt-app.exe"
            "tpt-app-x86_64-unknown-linux-gnu/tpt-app"
            "tpt-app-aarch64-apple-darwin/tpt-app"
          )
          missing=()
          for rel in "${bins[@]}"; do
            path="artifacts/$rel"
            if [ ! -s "$path" ]; then
              missing+=("$rel")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::missing or empty build artifacts: %s\n' "${missing[*]}"
            echo "Downloaded artifacts:"
            find artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | sort
            exit 1
          fi

          # The exec bit does not survive the artifact round trip, so restore it
          # before archiving; `tar` records it in the Unix mode.
          chmod +x artifacts/tpt-app-x86_64-unknown-linux-gnu/tpt-app
          tar -C artifacts/tpt-app-x86_64-unknown-linux-gnu -czf \
            "dist/tpt-app-${tag}-x86_64-linux.tar.gz" tpt-app

          chmod +x artifacts/tpt-app-aarch64-apple-darwin/tpt-app
          tar -C artifacts/tpt-app-aarch64-apple-darwin -czf \
            "dist/tpt-app-${tag}-aarch64-macos.tar.gz" tpt-app

          # `python3 -m zipfile` instead of an `apt-get install zip` round trip:
          # the interpreter ships with the image, so packaging never depends on
          # a repo fetch. The exec bit is meaningless for a Windows .exe.
          (cd artifacts/tpt-app-x86_64-pc-windows-msvc &&
            python3 -m zipfile -c \
              "../../dist/tpt-app-${tag}-x86_64-windows.zip" tpt-app.exe)

          # Exactly the three shipped archives must exist. Without `nullglob`,
          # an empty `dist/` would expand to a literal `dist/*` argument.
          archives=(dist/*)
          if [ "${#archives[@]}" -ne 3 ]; then
            printf '::error::expected 3 archives, found %d\n' "${#archives[@]}"
            exit 1
          fi
          ls -l "${archives[@]}"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="${GITHUB_REF_NAME}"
          archives=(dist/*)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "::error::no archives to publish"
            exit 1
          fi
          # A re-run or re-pushed tag finds the release already present; upload
          # with --clobber so the publish step is idempotent.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${archives[@]}" --clobber
          else
            gh release create "$tag" "${archives[@]}" --title "$tag" --generate-notes
          fi
