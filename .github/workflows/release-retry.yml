name: retry release on runner capacity

# GitHub's hosted arm64 macOS runners occasionally run out of capacity. A
# `macos-26` job can queue for ~15 min and then be cancelled with "The job
# was not acquired by Runner of type hosted" before any step runs (0.2.1 failed
# this way; the windows/linux builds and their artifacts were fine). Re-running
# the whole run usually picks up a runner and completes publish, without
# weakening the three-platform release contract in release.yml.
on:
  workflow_run:
    workflows: ["release"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: >-
      github.event.workflow_run.conclusion == 'failure' ||
      github.event.workflow_run.conclusion == 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Rerun only a runner-capacity cancellation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          # Cap the self-heal so a genuinely broken build is not retried forever.
          attempt=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID" --jq '.run_attempt')
          if [ "$attempt" -ge 3 ]; then
            echo "::notice::run already attempted $attempt times; leaving it for a real fix"
            exit 0
          fi
          # A capacity failure leaves a job cancelled with no steps at all; a
          # real compile failure has at least one failed step and must not be
          # retried here (it would just fail three times).
          unstarted=$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.conclusion == "cancelled" and (.steps | length == 0))] | length')
          if [ "$unstarted" -eq 0 ]; then
            echo "::notice::no unstarted job; the failure needs a real fix, not a retry"
            exit 0
          fi
          echo "::warning::$unstarted job(s) never reached a runner; rerunning the whole run"
          # Re-run every job, not just the failed ones: `rerun --failed` is
          # ambiguous about cancelled jobs and about the publish job that was
          # skipped upstream. A full rerun always produces all three archives.
          gh run rerun "$RUN_ID" --repo "$GH_REPO"
