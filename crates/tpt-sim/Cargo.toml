[package]
name = "tpt-sim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GPU (CubeCL + wgpu) simulation core for the Rust Powder Toy rewrite"

[features]
# Opt-in M0 infrastructure probes (256^3 allocation, indirect dispatch and
# CubeCL/wgpu storage binding). These are white-box smoke checks from the 3D
# foundation milestone, not element behaviour, so they stay out of the default
# regression suite.
diagnostics = []

[dependencies]
tpt-core = { workspace = true }
cubecl = { workspace = true }
cubecl-wgpu = { workspace = true }
cubecl-core = { workspace = true }
cubecl-runtime = { workspace = true }
bytemuck = { workspace = true }
serde = { workspace = true }
glam = { workspace = true }

[dev-dependencies]
pollster = { workspace = true }
wgpu = { workspace = true }

[[test]]
name = "gpu_voxel3d_tests"
required-features = ["diagnostics"]

[[test]]
name = "gpu_voxel3d_render_tests"
required-features = ["diagnostics"]
